<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngageMind Document Viewer</title>
    <meta name="description" content="View the EngageMind thesis document online.">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="favicon.ico">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
        }
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Animated gradient background */
            background: linear-gradient(120deg, #232526, #414345, #232526);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            min-width: 260px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 1.1em;
            color: #fff;
            background: rgba(34, 34, 34, 0.55);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.18);
            text-align: center;
            gap: 18px;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #fff;
            border-top: 4px solid #6dd5ed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #fullscreen-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 102;
            background: rgba(34,34,34,0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6em;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            transition: background 0.2s, transform 0.2s;
        }
        #fullscreen-btn:hover {
            background: #6dd5ed;
            color: #232526;
            transform: scale(1.08);
        }
        iframe {
            border: none;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }
        @media (max-width: 600px) {
            #fullscreen-btn {
                width: 38px;
                height: 38px;
                font-size: 1.2em;
                top: 10px;
                right: 10px;
            }
            #loader {
                min-width: 180px;
                min-height: 80px;
                font-size: 1em;
            }
        }
    </style>
    <!-- Minimal Analytics (Optional, Privacy-Friendly) -->
    <!-- <script defer data-domain="engagemind.github.io" src="https://plausible.io/js/plausible.js"></script> -->
</head>
<body>
    <div id="loader" role="status">
        <div class="spinner"></div>
        <span id="loader-text">Loading document...</span>
    </div>
    <button id="fullscreen-btn" aria-label="View PDF in full screen" title="Full Screen (F)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4H9V6H6V9H4V4ZM20 4V9H18V6H15V4H20ZM20 20H15V18H18V15H20V20ZM4 20V15H6V18H9V20H4Z" fill="currentColor"/>
        </svg>
    </button>
    <iframe id="pdf-frame" src="thesis.pdf" aria-label="Document: thesis.pdf" tabindex="0"></iframe>
    <script>
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const iframe = document.getElementById('pdf-frame');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        let pdfLoaded = false;

        // Hide loader when PDF loads
        iframe.onload = function() {
            loader.style.display = 'none';
            pdfLoaded = true;
        };
        // No error overlay or download if PDF fails to load
        setTimeout(() => {
            if (!pdfLoaded) {
                loader.style.display = 'none';
            }
        }, 5000); // 5 seconds timeout

        // Fullscreen functionality
        fullscreenBtn.onclick = function() {
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        };

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            // F for fullscreen
            if (e.key === 'f' || e.key === 'F') {
                fullscreenBtn.click();
            }
        });

        // Mobile optimization: prompt to rotate device
        function checkOrientation() {
            if(window.innerWidth < 700 && window.innerHeight > window.innerWidth) {
                loaderText.innerText = 'For best viewing, rotate your device.';
            } else if (!pdfLoaded) {
                loaderText.innerText = 'Loading document...';
            }
        }
        window.addEventListener('resize', checkOrientation);
        checkOrientation();
    </script>
</body>
</html>
